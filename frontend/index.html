<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RD2484R 雷达监视</title>
<link rel="stylesheet" href="style.css?v=9">
<script>
// 调试钩子：把首个运行时错误暴露到 DOM，便于定位
window.addEventListener('error', function (e) {
  var d = document.getElementById('jserr');
  if (!d) { d = document.createElement('div'); d.id = 'jserr';
    d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;background:#b00;color:#fff;font:12px monospace;padding:2px 6px';
    document.body.appendChild(d); }
  d.textContent = 'JSERR ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno;
});
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".35"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".6"/>
        <circle cx="16" cy="16" r="2.4" fill="currentColor"/>
        <path d="M16 16 L27 9.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <h1>RD2484R 雷达监视</h1>
        <p>DJI Agras T40 · 24 GHz 有源相控阵</p>
      </div>
    </div>

    <div class="badges">
      <span class="badge" id="badge-conn"><i></i>连接中</span>
      <span class="badge" id="badge-run"><i></i>已停止</span>
      <span class="badge" id="badge-crc"><i></i>CRC —</span>
      <span class="badge ghost" id="badge-src">SIM</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <main class="grid">

    <section class="panel ppi-panel">
      <div class="panel-head">
        <h2>全向态势 <span class="hint">侧阵 12×6 · 机械扫描</span></h2>
        <div class="ranges" id="ranges"></div>
      </div>
      <div class="ppi-wrap">
        <canvas id="ppi"></canvas>
        <div class="ppi-hint" id="ppi-hint">等待数据…</div>
      </div>
      <div class="ppi-foot">
        <span class="legend">
          <i class="lg-ground"></i>地面
          <i class="lg-wire"></i>线缆
          <i class="lg-pcla"></i>障碍
        </span>
        <span id="ppi-stat">—</span>
        <span id="range-foot">0 – 20 m</span>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <label>最近障碍物</label>
        <div class="big"><span id="near-dist">—</span><em>m</em></div>
        <div class="sub" id="near-az">等待数据…</div>
      </div>

      <div class="card">
        <label>跟踪目标 <span class="pill" id="trk-count">0</span></label>
        <ul id="trk-list"><li class="empty">无确认航迹</li></ul>
      </div>

      <div class="card">
        <label>电机转速 <span class="tag">CAN 下发</span></label>
        <div class="big"><span id="rpm-val">—</span><em>rpm</em></div>
        <div class="sub" id="rpm-sub">雷达未通过 V2 上报转速</div>
      </div>

      <div class="card">
        <label>雷达高度</label>
        <div class="big"><span id="h-val">—</span><em>cm</em></div>
        <div class="sub" id="h-sub">本地设定 · 用于俯仰剖面</div>
      </div>

      <div class="card mini">
        <label>俯仰剖面</label>
        <canvas id="elev"></canvas>
      </div>

      <div class="card proto">
        <label>1E61 协议帧</label>
        <div class="kv" id="proto-kv">—</div>
        <code id="proto-hex"></code>
      </div>
    </aside>

  </main>

  <footer class="controls">
    <button class="btn primary" id="btn-run">启动</button>

    <div class="ctl">
      <label>转速 <b id="rpm-label">60</b> rpm</label>
      <input type="range" id="rpm" min="0" max="1800" step="10" value="60">
    </div>

    <div class="ctl">
      <label>场景</label>
      <select id="scene">
        <option value="room">室内房间</option>
        <option value="field">开阔场地</option>
        <option value="wire">线缆场景</option>
        <option value="obstacle">走廊行人</option>
      </select>
    </div>

    <div class="ctl">
      <label>雷达高度 <b id="h-label">180</b> cm</label>
      <input type="range" id="height" min="20" max="300" step="1" value="180">
    </div>

    <div class="spacer"></div>
    <div class="stat" id="stat-fps">—</div>
  </footer>

</div>
<script src="app.js?v=10"></script>
</body>
</html>
